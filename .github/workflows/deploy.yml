name: Deploy TypeScript Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npx tsc

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Zip and Deploy
        run: |
          # 1. Copy package files to the build folder
          cp package.json package-lock.json ./dist/

          # 2. Go into dist and install ONLY production dependencies
          cd dist
          npm install --omit=dev

          # 3. Zip everything inside dist (code + node_modules)
          zip -r ../function.zip .
          cd ..

          # 4. Push to AWS
          aws lambda update-function-code --function-name saad-lambda --zip-file fileb://function.zip
